<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% if success %}
            Email Verified | Aksyon
        {% else %}
            Verification Failed | Aksyon
        {% endif %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f4f6f8;
            color: #1f2937;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 32px;
            color: #111827;
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 24px;

            font-size: 34px;
            font-weight: 700;
        }

        .icon.success {
            background: #dcfce7;
            color: #16a34a;
        }

        .icon.error {
            background: #fee2e2;
            color: #dc2626;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 28px;
            line-height: 1.2;
            letter-spacing: -0.5px;

            color: #111827;
        }

        p {
            margin: 0;

            font-size: 16px;
            line-height: 1.6;

            color: #6b7280;
        }

        .message {
            margin-top: 8px;
        }

        .footer {
            margin-top: 28px;

            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 32px 24px;
                border-radius: 18px;
            }

            .brand {
                margin-bottom: 28px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="brand">
                Aksyon
            </div>

            {% if success %}

                <div class="icon success">
                    ✓
                </div>

                <h1>
                    Email verified!
                </h1>

                <p>
                    Your email address has been successfully
                    verified.
                </p>

                <p class="message">
                    Your Aksyon account is now ready to use.
                </p>

            {% else %}

                <div class="icon error">
                    !
                </div>

                <h1>
                    Verification failed
                </h1>

                <p>
                    {{ message }}
                </p>

            {% endif %}

            <div class="footer">
                Aksyon
            </div>

        </div>

    </div>

</body>
</html>
