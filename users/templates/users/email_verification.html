<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Email Verification | Aksyon</title>
</head>

<body>
    <main>
        {% if success %}
            <h1>Email verified!</h1>

            <p>
                Your email address has been successfully
                verified. Your Aksyon account is now ready to use.
            </p>
        {% else %}
            <h1>Verification failed</h1>

            <p>
                {{ message }}
            </p>
        {% endif %}
    </main>
</body>
</html>
